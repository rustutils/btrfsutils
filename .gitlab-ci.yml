# GitLab CI for btrfsutils.
#
# Stages:
#   lint           -> rustfmt, clippy, cargo doc warnings
#   test           -> unit tests (privileged integration tests run locally)
#   package        -> just package (deb, rpm, tarball, raw binary, 3 archs)
#   release        -> GitLab release on tag, links package artifacts
#   release-github -> mirror release to github.com/rustutils/btrfsutils
#   deploy         -> mdbook to GitLab Pages (master only)
#
# Rust jobs run on rust:slim-trixie and pick up rust-toolchain.toml on
# first use. Debian, not Alpine, because bindgen dlopens libclang and
# musl rustc can't.

stages:
  - lint
  - test
  - package
  - release
  - deploy

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  RUSTUP_HOME: $CI_PROJECT_DIR/.rustup
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  # sccache stores rustc outputs in the shared rustutils-cache S3 bucket
  # on Hetzner. SCCACHE_BUCKET, _ENDPOINT, and _REGION come from the
  # rustutils group CI variables. The AWS keys are protected, so only
  # master and version tags write to the cache. Other branches read
  # anonymously (see .rust before_script). No key prefix, so common
  # deps are shared across rustutils projects.
  RUSTC_WRAPPER: sccache
  # Pinned packaging tool versions. `cargo install --version` is a no-op
  # when the cached install matches.
  CARGO_DEB_VERSION: "3.6.4"
  CARGO_GENERATE_RPM_VERSION: "0.20.0"
  CARGO_ZIGBUILD_VERSION: "0.20.0"
  # Upstream Zig tarball. cargo-zigbuild needs 0.11 or later.
  ZIG_VERSION: "0.13.0"
  # Upstream static sccache. Older Debian packages lack the S3 backend
  # config and fail with "cache type is not enabled".
  SCCACHE_VERSION: "0.15.0"
  ALPINE_VERSION: "3.23"

# Caches, split by how often they invalidate. Jobs compose them with
# YAML anchors because extends:cache array merging is unreliable.
#
# - registry: crate sources and index. Keyed on Cargo.lock. Shared by
#   all Rust jobs.
# - bin: cargo-deb and cargo-generate-rpm. Keyed on .gitlab-ci.yml,
#   where their versions are pinned. Package job only.
#
# target/ is not cached. sccache makes rebuilding it cheap, and the
# 2 GB upload cost about a minute per job.
#
# .rustup is not cached either. Downloading the toolchain takes about
# as long as restoring a 300 MB cache.
.cache-defs:
  cache:
    - &cache-registry
      key:
        files: [Cargo.lock]
      paths:
        - .cargo/registry/cache
        - .cargo/registry/index
    - &cache-bin
      key:
        files: [.gitlab-ci.yml]
      paths:
        - .cargo/bin
        - .cargo/.crates.toml
        - .cargo/.crates2.json

# Base template for Rust jobs. CARGO_HOME and RUSTUP_HOME point into
# $CI_PROJECT_DIR so the registry and toolchain are inside the cache
# scope.
.rust:
  image: rust:slim-trixie
  cache:
    - *cache-registry
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends git ca-certificates libclang-dev clang curl
    - curl -fsSL "https://github.com/mozilla/sccache/releases/download/v$SCCACHE_VERSION/sccache-v$SCCACHE_VERSION-x86_64-unknown-linux-musl.tar.gz" | tar xz -C /opt
    - export PATH="/opt/sccache-v$SCCACHE_VERSION-x86_64-unknown-linux-musl:$CARGO_HOME/bin:$PATH"
    # Without the protected AWS credentials (unprotected branches),
    # NO_CREDENTIALS makes sccache read the public bucket anonymously.
    # Writes fail silently.
    - if [ -z "${AWS_ACCESS_KEY_ID:-}" ]; then export SCCACHE_S3_NO_CREDENTIALS=true; fi
    - rustup show

lint:
  extends: .rust
  stage: lint
  script:
    - rustup component add clippy
    - rustup toolchain install nightly --component rustfmt --profile minimal
    - cargo +nightly fmt --all --check
    - RUSTDOCFLAGS="-Dwarnings" cargo doc --no-deps --workspace
    - cargo clippy --workspace --all-features --all-targets -- -Dwarnings
    - sccache --show-stats || true

test:
  extends: .rust
  stage: test
  before_script:
    - !reference [.rust, before_script]
    # btrfs-fs tests run mkfs.btrfs to build a backing image. No
    # privileges needed.
    - apt-get install -y --no-install-recommends btrfs-progs
  script:
    # Unit tests only. The #[ignore] integration tests need root for
    # loopback mounts and privileged ioctls, which shared runners lack.
    #
    # btrfs-fuse is excluded: its tests mount through FUSE, which hangs
    # in Docker on the shared runners. Run `cargo test -p btrfs-fuse`
    # locally.
    - cargo test --workspace --all-features --exclude btrfs-fuse
    - sccache --show-stats || true

package:
  extends: .rust
  stage: package
  # Adds the bin cache to the .rust default.
  cache:
    - *cache-registry
    - *cache-bin
  rules:
    # Automatic on tags, feeds the release job.
    - if: $CI_COMMIT_TAG
      when: on_success
    # Manual on branches, to test packaging without a tag.
    # allow_failure keeps the pipeline green when skipped.
    - when: manual
      allow_failure: true
  before_script:
    - !reference [.rust, before_script]
    - apt-get install -y --no-install-recommends zstd just curl xz-utils
    # Upstream Zig, at the version cargo-zigbuild expects.
    - curl -sL "https://ziglang.org/download/$ZIG_VERSION/zig-linux-x86_64-$ZIG_VERSION.tar.xz" | tar xJ -C /opt
    - export PATH="/opt/zig-linux-x86_64-$ZIG_VERSION:$PATH"
    - cargo install --locked --version "$CARGO_ZIGBUILD_VERSION" cargo-zigbuild
    - cargo install --locked --version "$CARGO_DEB_VERSION" cargo-deb
    - cargo install --locked --version "$CARGO_GENERATE_RPM_VERSION" cargo-generate-rpm
    # Install std for each musl target. zigbuild only provides the
    # linker.
    - rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl riscv64gc-unknown-linux-musl
  script:
    - export PATH="/opt/zig-linux-x86_64-$ZIG_VERSION:$PATH"
    - just package
    - sccache --show-stats || true
  artifacts:
    paths:
      - target/dist/
    # Linked from the release page, so never expire.
    expire_in: never

# Tags only. scripts/release.rb reads the matching CHANGELOG section,
# links every artifact in target/dist/, and calls release-cli.
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+(-[\w.]+)?$/
  needs:
    - job: package
      artifacts: true
  script:
    - apk add --no-cache ruby
    - ruby scripts/release.rb

# Mirror the release to github.com/<CI_PROJECT_PATH> with gh. Separate
# from the GitLab release so a GitHub failure doesn't affect it. Needs
# GITHUB_TOKEN as a protected rustutils group variable.
release-github:
  stage: release
  image: alpine:$ALPINE_VERSION
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+(-[\w.]+)?$/
  needs:
    - job: package
      artifacts: true
  script:
    - apk add --no-cache ruby github-cli
    - ruby scripts/release_github.rb

pages:
  image: alpine
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - apk add mdbook
    - mdbook build
    - mv target/book public
  artifacts:
    paths:
      - public
